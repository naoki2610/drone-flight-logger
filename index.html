
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Logger</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        button { width: 100%; height: 80px; font-size: 24px; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 20px; }
        .btn-takeoff { background-color: #28a745; color: white; }
        .btn-export { background-color: #007bff; color: white; margin-top: 10px; }
        .log-list { background: white; border-radius: 8px; padding: 15px; text-align: left; }
    </style>
</head>
<body>
    <h1>Flight Logger</h1>
    <button class="btn-takeoff" onclick="logTime()">TAKE OFF</button>
    <div class="log-list" id="logList">
        <h3>記録一覧</h3>
    </div>
    <button class="btn-export" onclick="exportCSV()">CSVで保存</button>

    <script>
        function logTime() {
            const now = new Date().toLocaleString();
            let logs = JSON.parse(localStorage.getItem('flightLogs') || '[]');
            logs.push({time: now});
            localStorage.setItem('flightLogs', JSON.stringify(logs));
            displayLogs();
        }

        function displayLogs() {
            const logs = JSON.parse(localStorage.getItem('flightLogs') || '[]');
            const container = document.getElementById('logList');
            container.innerHTML = '<h3>記録一覧</h3>';
            logs.forEach(log => {
                const div = document.createElement('div');
                div.textContent = log.time;
                container.appendChild(div);
            });
        }

        function exportCSV() {
            const logs = JSON.parse(localStorage.getItem('flightLogs') || '[]');
            let csvContent = "data:text/csv;charset=utf-8,Time\n";
            logs.forEach(row => csvContent += row.time + "\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "flight_logs.csv");
            document.body.appendChild(link);
            link.click();
        }

        displayLogs();
    </script>
</body>
</html>
